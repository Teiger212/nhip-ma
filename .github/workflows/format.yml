name: Format

# The format check on every pull request and push to main, docs included: oxfmt formats Markdown
# too, and ci.yml skips docs-only pull requests.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

  # A pull request adds its changelog entry as a fragment in changelog.d/; changelog.yml folds it
  # into CHANGELOG.md on main (#200). Here, not in ci.yml, because ci.yml skips docs-only PRs.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The whole history, so the PR's own diff (base...head) has its merge base.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Against the base branch's current tip, not the event's base.sha, so a branch that merged
      # main after a fold isn't blamed for the fold's CHANGELOG.md change. --no-renames, so a
      # rename of CHANGELOG.md shows as its deletion.
      - name: The PR leaves CHANGELOG.md alone
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --quiet --no-tags origin "$GITHUB_BASE_REF"
          status=0
          git diff --quiet --no-renames "FETCH_HEAD...$HEAD_SHA" -- CHANGELOG.md || status=$?
          if ((status == 1)); then
            echo "::error file=CHANGELOG.md::This PR edits CHANGELOG.md. Put its entry in a fragment, changelog.d/<issue>-<slug>.md, instead (changelog.d/README.md); a workflow folds it in on main."
          fi
          exit "$status"

      - name: Each fragment is one dated section
        run: node scripts/changelog/fold.mjs --check
