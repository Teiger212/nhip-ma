name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/supastarter
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
  NEXT_PUBLIC_SAAS_URL: http://localhost:3010
  RESEND_API_KEY: re_ci
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/supastarter_test

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Staging and prod run Postgres 18 on Neon (ADR 0016); CI matches.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supastarter
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint is type-aware; without the generated client, Prisma types read as errors.
      - name: Generate Prisma client
        run: pnpm --filter @repo/database generate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Migrations match the schema
        run: pnpm --filter @repo/database migrate:check

      - name: Seed script loads
        run: pnpm --filter saas seed:check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A production build on :3000 behind a local HTTPS proxy on :3443, against its own database
    # (AGENTS.md, "Test quality"); playwright.config.ts sets the app URL.
    # These job-level values win over the workflow-level ones and over .env.e2e.
    env:
      E2E: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/supastarter_e2e
      BETTER_AUTH_SECRET: e2e-only-not-a-secret-0123456789abcdef-nhip
      SEND_MODE: mock
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supastarter_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter saas exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm --filter @repo/database generate

      - name: E2E (Playwright, no retries)
        run: pnpm --filter saas exec playwright test --reporter=line,html

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/saas/playwright-report/
          retention-days: 14
