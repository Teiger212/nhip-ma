name: CI

# A pull request that changes only documentation skips this workflow; GitHub skips it only when
# every changed file matches. format.yml still checks Markdown formatting on every PR. Pushes to
# main always run it all. main has no required status checks, so a skipped run blocks nothing.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "reports/**"
  push:
    branches:
      - main

# A pull request's newer push cancels its older run. On main every commit gets its own group, so
# no run is cancelled or dropped while queued: the release gate needs each one's verdict (#190).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/supastarter
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
  NEXT_PUBLIC_SAAS_URL: http://localhost:3010
  RESEND_API_KEY: re_ci
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/supastarter_test

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Staging and prod run Postgres 18 on Neon (ADR 0016); CI matches.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supastarter
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint is type-aware; without the generated client, Prisma types read as errors.
      - name: Generate Prisma client
        run: pnpm --filter @repo/database generate

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Changelog fold tests
        run: node --test scripts/changelog/fold.test.mjs

      - name: Migrations match the schema
        run: pnpm --filter @repo/database migrate:check

      # Squawk on the migrations this PR adds, never on applied ones (#98). HEAD is the PR's merge
      # commit, so the diff against the base's tip is what the PR adds.
      - name: Lint new migrations
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          pnpm --filter @repo/database migrate:lint --since FETCH_HEAD

      - name: Seed script loads
        run: pnpm --filter saas seed:check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A production build on :3000 behind a local HTTPS proxy on :3443, against its own database
    # (AGENTS.md, "Test quality"); playwright.config.ts sets the app URL.
    # These job-level values win over the workflow-level ones and over .env.e2e.
    env:
      E2E: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/supastarter_e2e
      BETTER_AUTH_SECRET: e2e-only-not-a-secret-0123456789abcdef-nhip
      SEND_MODE: mock
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supastarter_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter saas exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm --filter @repo/database generate

      # Web push's VAPID pair is made fresh for this run and never committed (#135); only its
      # subject is in .env.e2e. playwright.config.ts would make one too; this makes it explicit
      # and keeps the private key masked in the log.
      - name: A fresh VAPID pair for this run
        working-directory: apps/saas
        run: |
          node -e '
            const { generateVAPIDKeys } = require("web-push");
            const { publicKey, privateKey } = generateVAPIDKeys();
            console.log(`::add-mask::${privateKey}`);
            require("node:fs").appendFileSync(
              process.env.GITHUB_ENV,
              `VAPID_PUBLIC_KEY=${publicKey}\nVAPID_PRIVATE_KEY=${privateKey}\n`,
            );
          '

      # `list` prints one line per test with its duration; `json` keeps every test's duration for
      # comparing runs (#223), in test-results/ (git-ignored), outside the html report's folder.
      - name: E2E (Playwright, no retries)
        run: pnpm --filter saas exec playwright test --reporter=list,html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/results.json

      # Every run, green or red: the html report (traces of failures) and the per-test durations.
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/saas/playwright-report/
            apps/saas/test-results/results.json
          retention-days: 14
